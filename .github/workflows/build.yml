name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make the wrapper usable
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew --no-daemon clean build

      - name: Verify the thin wrapper
        run: |
          set -euo pipefail
          test -f build/libs/d8-wrapper.jar
          test -f build/libs/d8-wrapper-all.jar
          test -f build/dexer/d8.jar

          jar tf build/libs/d8-wrapper.jar > build/wrapper-entries.txt
          jar tf build/libs/d8-wrapper-all.jar > build/all-entries.txt

          if grep -q '^com/android/tools/r8/' build/wrapper-entries.txt; then
            echo "d8-wrapper.jar must not contain the D8 dexer"
            exit 1
          fi
          grep -q '^tw/mmunki/d8wrapper/cli/Main.class$' build/wrapper-entries.txt
          grep -q '^LICENSE
 build/wrapper-entries.txt
          grep -q '^META-INF/LICENSE
 build/wrapper-entries.txt
          grep -q '^com/android/tools/r8/D8.class$' build/all-entries.txt

      - name: Show the artifacts
        run: ls -l build/libs build/dexer
