name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make the wrapper usable
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew --no-daemon clean build

      - name: Show the size of the JAR
        run: ls -l build/libs/d8-wrapper.jar
